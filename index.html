<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invasive Plant Sightings – Ontario</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: sans-serif; }
    #map { width: 100%; height: 100vh; }

    .form-button {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 1000;
      padding: 12px 24px;
      background-color: #2e7d32;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      text-decoration: none;
      display: inline-block;
    }
    .form-button:hover { background-color: #1b5e20; }
  </style>
</head>
<body>
  <a
    class="form-button"
    href="https://docs.google.com/forms/d/e/1FAIpQLSdaBUcN7HmkHq1zmySDaWQ1LLKvfBWTM0sMiB_fdmG4tR_8cw/viewform?usp=header"
    target="_blank"
    rel="noopener noreferrer"
  >
    Report a Sighting
  </a>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Centre the map on Ontario
    var map = L.map('map').setView([50.0, -85.0], 5);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // ---- Heatmap PNG overlay ----
    // Upload your PNG as "heatmap.png" next to this index.html.
    // Adjust the corner coordinates below to match the extent of your image.
    var imageBounds = [
      [41.7, -95.2],   // South-West corner
      [56.9, -74.3]    // North-East corner
    ];

    L.imageOverlay('heatmap.png', imageBounds, { opacity: 0.65 }).addTo(map);
  </script>
</body>
</html>
